server.port=8080
spring.application.name=user-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:realworld}?currentSchema=user_schema
spring.datasource.username=${DB_USER:realworld}
spring.datasource.password=${DB_PASSWORD:realworld}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.schemas=user_schema
spring.flyway.locations=classpath:db/migration

spring.jackson.deserialization.UNWRAP_ROOT_VALUE=true

image.default=https://static.productionready.io/images/smiley-cyrus.jpg

jwt.secret=${JWT_SECRET}
jwt.sessionTime=86400

mybatis.configuration.cache-enabled=true
mybatis.configuration.default-statement-timeout=3000
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true
mybatis.type-handlers-package=io.spring.common.mybatis
mybatis.mapper-locations=mapper/*.xml

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
