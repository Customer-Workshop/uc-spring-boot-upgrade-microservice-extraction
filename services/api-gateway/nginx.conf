upstream user-service {
    server user-service:8080;
}

upstream article-service {
    server article-service:8081;
}

upstream comment-service {
    server comment-service:8082;
}

upstream favorite-service {
    server favorite-service:8083;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name localhost;

    # User service routes
    location /api/users {
        proxy_pass http://user-service/users;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/user {
        proxy_pass http://user-service/user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/profiles {
        proxy_pass http://user-service/profiles;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Comment service routes (must come before article catch-all)
    location ~ ^/api/articles/([^/]+)/comments(.*)$ {
        proxy_pass http://comment-service/articles/$1/comments$2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Favorite service routes (must come before article catch-all)
    location ~ ^/api/articles/([^/]+)/favorite(.*)$ {
        proxy_pass http://favorite-service/articles/$1/favorite$2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tags route -> article service
    location /api/tags {
        proxy_pass http://article-service/tags;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Article service routes (catch-all for /api/articles)
    location /api/articles {
        proxy_pass http://article-service/articles;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoints
    location /api/health/user {
        proxy_pass http://user-service/actuator/health;
    }

    location /api/health/article {
        proxy_pass http://article-service/actuator/health;
    }

    location /api/health/comment {
        proxy_pass http://comment-service/actuator/health;
    }

    location /api/health/favorite {
        proxy_pass http://favorite-service/actuator/health;
    }

    # Frontend (default)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
