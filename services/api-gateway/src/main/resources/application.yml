server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000,http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: account-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/accounts/**
        - id: transaction-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/entries/**,/api/v1/transactions/**,/api/v1/trades/**
        - id: budget-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/categories/**,/api/v1/budgets/**,/api/v1/tags/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
