spring.datasource.url=jdbc:sqlite:build/cucumber.db
spring.datasource.hikari.maximum-pool-size=1
# Only run V1 migration (table creation), the scenarios own their data
spring.flyway.target=1
spring.flyway.clean-on-validation-error=true

logging.level.io.spring.infrastructure.mybatis.readservice.ArticleReadService=WARN
logging.level.io.spring.infrastructure.mybatis.mapper=WARN
