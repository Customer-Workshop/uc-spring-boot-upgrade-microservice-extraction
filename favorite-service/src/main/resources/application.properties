server.port=8082

spring.datasource.url=jdbc:sqlite:dev.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

mybatis.configuration.cache-enabled=true
mybatis.configuration.default-statement-timeout=3000
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true
mybatis.type-handlers-package=io.spring.favorite
mybatis.mapper-locations=mapper/*.xml

# Article Service base URL for cross-service calls
article.service.url=http://localhost:8080

# JWT configuration (shared secret across services)
jwt.secret=${JWT_SECRET:changeme}
jwt.sessionTime=86400

logging.level.io.spring.favorite=DEBUG
