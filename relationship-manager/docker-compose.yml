  analytics-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: analytics-service } }
    ports:
      - "8090:8090"
    environment:
      JWT_SECRET: rm-secure-jwt-secret-for-docker-compose
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
