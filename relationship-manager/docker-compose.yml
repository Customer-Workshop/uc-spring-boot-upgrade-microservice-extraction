  followup-orchestrator:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: followup-orchestrator } }
    ports:
      - "8088:8088"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: rm-secure-jwt-secret-for-docker-compose
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_followup
