version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  api-gateway:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: api-gateway } }
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  auth-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: auth-service } }
    ports:
      - "8081:8081"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: rm-secure-jwt-secret-for-docker-compose
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_auth
    depends_on:
      postgres: { condition: service_healthy }

  customer-profile-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: customer-profile-service } }
    ports:
      - "8082:8082"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: rm-secure-jwt-secret-for-docker-compose
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_profile
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }

  conversation-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: conversation-service } }
    ports:
      - "8083:8083"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: rm-secure-jwt-secret-for-docker-compose
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_conversation
      KAFKA_BOOTSTRAP: kafka:29092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }

  risk-profiling-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: risk-profiling-service } }
    ports:
      - "8084:8084"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: rm-secure-jwt-secret-for-docker-compose
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_risk
      KAFKA_BOOTSTRAP: kafka:29092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }

  product-catalog-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: product-catalog-service } }
    ports:
      - "8085:8085"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: rm-secure-jwt-secret-for-docker-compose
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_product
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
