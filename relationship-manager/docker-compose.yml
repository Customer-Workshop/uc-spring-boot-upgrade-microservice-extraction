    ports:
      - "8089:8089"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: rm-secure-jwt-secret-for-docker-compose
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_notification
      KAFKA_BOOTSTRAP: kafka:29092
