      JWT_SECRET: rm-secure-jwt-secret-for-docker-compose
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_reminder
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api-gateway:8080/api/v1
    depends_on:
      - api-gateway

volumes:
  postgres_data:
