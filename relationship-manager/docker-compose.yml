version: '3.8'

services:
  # ---------- Infrastructure ----------
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper

  # ---------- Services ----------
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: ../Dockerfile
      args:
        SERVICE_NAME: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - redis

  auth-service:
    build:
      context: ./auth-service
      dockerfile: ../Dockerfile
      args:
        SERVICE_NAME: auth-service
    ports:
      - "8081:8081"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_auth
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  conversation-service:
    build:
      context: ./conversation-service
      dockerfile: ../Dockerfile
      args:
        SERVICE_NAME: conversation-service
    ports:
      - "8083:8083"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_conversation
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_HOST: redis
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  customer-profile-service:
    build:
      context: ./customer-profile-service
      dockerfile: ../Dockerfile
      args:
        SERVICE_NAME: customer-profile-service
    ports:
      - "8082:8082"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_profile
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  risk-profiling-service:
    build:
      context: ./risk-profiling-service
      dockerfile: ../Dockerfile
      args:
        SERVICE_NAME: risk-profiling-service
    ports:
      - "8084:8084"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_risk
      KAFKA_BOOTSTRAP: kafka:9092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  product-catalog-service:
    build:
      context: ./product-catalog-service
      dockerfile: ../Dockerfile
      args:
        SERVICE_NAME: product-catalog-service
    ports:
      - "8085:8085"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_product
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  recommendation-service:
    build:
      context: ./recommendation-service
      dockerfile: ../Dockerfile
      args:
        SERVICE_NAME: recommendation-service
    ports:
      - "8086:8086"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_recommendation
      KAFKA_BOOTSTRAP: kafka:9092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  wealth-projection-service:
    build:
      context: ./wealth-projection-service
      dockerfile: ../Dockerfile
      args:
        SERVICE_NAME: wealth-projection-service
    ports:
      - "8087:8087"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_projection
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  followup-orchestrator:
    build:
      context: ./followup-orchestrator
      dockerfile: ../Dockerfile
      args:
        SERVICE_NAME: followup-orchestrator
    ports:
      - "8088:8088"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_followup
      KAFKA_BOOTSTRAP: kafka:9092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ./notification-service
      dockerfile: ../Dockerfile
      args:
        SERVICE_NAME: notification-service
    ports:
      - "8089:8089"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_notification
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  reminder-service:
    build:
      context: ./reminder-service
      dockerfile: ../Dockerfile
      args:
        SERVICE_NAME: reminder-service
    ports:
      - "8092:8092"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_reminder
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: ../Dockerfile
      args:
        SERVICE_NAME: analytics-service
    ports:
      - "8090:8090"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      kafka:
        condition: service_started

  admin-service:
    build:
      context: ./admin-service
      dockerfile: ../Dockerfile
      args:
        SERVICE_NAME: admin-service
    ports:
      - "8091:8091"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_admin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
