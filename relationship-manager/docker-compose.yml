  recommendation-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: recommendation-service } }
    ports:
      - "8086:8086"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: rm-secure-jwt-secret-for-docker-compose
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_recommendation
      KAFKA_BOOTSTRAP: kafka:29092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }

  wealth-projection-service:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: wealth-projection-service } }
    ports:
      - "8087:8087"
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: rm-secure-jwt-secret-for-docker-compose
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_projection
