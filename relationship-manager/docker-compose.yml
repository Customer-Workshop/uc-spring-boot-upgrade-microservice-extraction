      DB_PASSWORD: postgres
      JWT_SECRET: rm-secure-jwt-secret-for-docker-compose
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rm_admin
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
