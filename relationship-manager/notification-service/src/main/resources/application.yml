server:
  port: 8089

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/rm_notification
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

jwt:
  secret: ${JWT_SECRET:rm-default-secret-key-for-development-only-change-in-production-1234567890}

notification:
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
    whatsapp-number: ${TWILIO_WHATSAPP_NUMBER:}
  sendgrid:
    api-key: ${SENDGRID_API_KEY:}
    from-email: ${SENDGRID_FROM_EMAIL:noreply@bank.com}
