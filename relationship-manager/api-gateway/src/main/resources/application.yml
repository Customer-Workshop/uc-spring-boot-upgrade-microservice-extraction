server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        - id: customer-profile-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/customers/**

        - id: conversation-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/conversations/**

        - id: conversation-ws
          uri: ws://localhost:8083
          predicates:
            - Path=/ws/chat/**

        - id: risk-profiling-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/risk/**

        - id: product-catalog-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/products/**

        - id: recommendation-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/recommendations/**

        - id: wealth-projection-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/projections/**

        - id: followup-orchestrator
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/followups/**

        - id: notification-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/notifications/**

        - id: analytics-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/analytics/**

        - id: admin-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/v1/admin/**

      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 200
        - AddResponseHeader=X-Response-Source, rm-api-gateway

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
