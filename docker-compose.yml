version: "3.8"

services:
  main-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - realworld
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/data/dev.db
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-realworld-internal-api-key-2024}

  article-service:
    build:
      context: ./article-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    networks:
      - realworld
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/data/article-dev.db
      - USER_SERVICE_URL=http://main-app:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-realworld-internal-api-key-2024}
    depends_on:
      - main-app

networks:
  realworld:
    driver: bridge
