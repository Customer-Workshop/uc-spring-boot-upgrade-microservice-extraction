version: "3.8"

services:
  comments-service:
    build:
      context: ./comments-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - comments-data:/app/data
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/app/data/comments.db

  monolith:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - monolith-data:/app/data
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/app/data/dev.db
      - COMMENTS_SERVICE_URL=http://comments-service:8081
    depends_on:
      - comments-service

volumes:
  comments-data:
  monolith-data:
