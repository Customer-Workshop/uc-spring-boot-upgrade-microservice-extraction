services:
  monolith:
    build:
      context: .
      dockerfile: Dockerfile
    image: realworld-monolith:latest
    ports:
      - "8080:8080"
    environment:
      # Point the monolith at the comments microservice (Spring relaxed binding
      # maps COMMENTS_SERVICE_URL -> comments.service.url).
      COMMENTS_SERVICE_URL: http://comments-service:8081
    depends_on:
      - comments-service
    networks:
      - realworld

  comments-service:
    build:
      context: ./comments-service
      dockerfile: Dockerfile
    image: realworld-comments-service:latest
    ports:
      - "8081:8081"
    environment:
      # Point the comments service back at the monolith for author profiles
      # (MONOLITH_URL -> monolith.url).
      MONOLITH_URL: http://monolith:8080
    networks:
      - realworld

networks:
  realworld:
    driver: bridge
