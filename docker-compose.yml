version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: realworld-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-realworld}
      POSTGRES_USER: ${DB_USER:-realworld}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-realworld}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realworld"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realworld-net

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: realworld-user-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-realworld}
      DB_USER: ${DB_USER:-realworld}
      DB_PASSWORD: ${DB_PASSWORD:-realworld}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - realworld-net

  article-service:
    build:
      context: .
      dockerfile: services/article-service/Dockerfile
    container_name: realworld-article-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-realworld}
      DB_USER: ${DB_USER:-realworld}
      DB_PASSWORD: ${DB_PASSWORD:-realworld}
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:8080
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - realworld-net

  comment-service:
    build:
      context: .
      dockerfile: services/comment-service/Dockerfile
    container_name: realworld-comment-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-realworld}
      DB_USER: ${DB_USER:-realworld}
      DB_PASSWORD: ${DB_PASSWORD:-realworld}
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:8080
      ARTICLE_SERVICE_URL: http://article-service:8081
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      article-service:
        condition: service_started
    networks:
      - realworld-net

  favorite-service:
    build:
      context: .
      dockerfile: services/favorite-service/Dockerfile
    container_name: realworld-favorite-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-realworld}
      DB_USER: ${DB_USER:-realworld}
      DB_PASSWORD: ${DB_PASSWORD:-realworld}
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:8080
      ARTICLE_SERVICE_URL: http://article-service:8081
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      article-service:
        condition: service_started
    networks:
      - realworld-net

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    container_name: realworld-frontend
    ports:
      - "3000:3000"
    networks:
      - realworld-net

  api-gateway:
    build:
      context: services/api-gateway
      dockerfile: Dockerfile
    container_name: realworld-api-gateway
    ports:
      - "80:80"
    depends_on:
      - user-service
      - article-service
      - comment-service
      - favorite-service
      - frontend
    networks:
      - realworld-net

volumes:
  postgres-data:

networks:
  realworld-net:
    driver: bridge
