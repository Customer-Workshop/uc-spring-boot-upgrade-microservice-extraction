apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: realworld-prod

namePrefix: prod-

resources:
  - ../../base
  - hpa.yaml

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /metadata/annotations
        value:
          note: "SQLite limits backend to 1 replica. Migrate to PostgreSQL for multi-replica scaling."
  - target:
      kind: Deployment
      name: frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: PersistentVolumeClaim
      name: backend-sqlite-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: "5Gi"

images:
  - name: realworld-backend
    newName: realworld-backend
    newTag: latest
  - name: realworld-frontend
    newName: realworld-frontend
    newTag: latest
