apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: realworld
  labels:
    app: backend
    app.kubernetes.io/part-of: realworld
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prod-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: realworld
  labels:
    app: frontend
    app.kubernetes.io/part-of: realworld
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prod-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
