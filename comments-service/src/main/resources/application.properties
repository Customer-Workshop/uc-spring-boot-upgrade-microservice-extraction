server.port=8081

spring.datasource.url=jdbc:sqlite:comments.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

spring.jackson.deserialization.UNWRAP_ROOT_VALUE=false

# URL of the monolith used to resolve comment author profiles.
monolith.url=http://localhost:8080

mybatis.configuration.cache-enabled=true
mybatis.configuration.default-statement-timeout=3000
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=io.spring.comments.infrastructure.mybatis
mybatis.mapper-locations=mapper/*.xml

logging.level.io.spring.comments=INFO
